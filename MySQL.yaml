---
- name: Setup MySQL db server
  hosts: dbgroup
  become: yes
  tasks:
    - name: Install MySQL server
      apt:
        name: mariadb-server
        state: present
    - name: Install Python MySQL
      apt:
        name: python3-pymysql
        state: present
    - name: Start & Enable mariadb service
      service:
        name: mariadb
        state: started
        enabled: yes
# Create new database  with name 'mysql'
    - name: Create new database
      mysql_db:
        login_unix_socket: /var/run/mysqld/mysqld.sock
        name: "{{dbname}}"
        state: present
# Create database user with name 'devops' with all database privileges
    - name: Create database user
      mysql_user:
       login_unix_socket: /var/run/mysqld/mysqld.sock
       name: "{{dbuser}}"
       password: "{{dbpass}}"
       priv: '*.*:ALL'
       state: present

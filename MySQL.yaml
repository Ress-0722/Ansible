---
- name: Setup MySQL/MariaDB server
  hosts: dbgroup
  become: yes
  vars:
    dbname: mysql         # Replace with actual DB name if needed
    dbuser: admin         # Replace with actual DB user if needed
    dbpass: admin123
  tasks:
    - name: Install MariaDB server
      apt:
        name: mariadb-server
        state: present
    - name: Install Python3 PyMySQL package
      apt:
        name: python3-pymysql
        state: present
    - name: Start & Enable MariaDB service
      service:
        name: mariadb
        state: started
        enabled: yes
# Create new database  with name 'mysql'
    - name: Create new database
      mysql_db:
        login_unix_socket: /var/run/mysqld/mysqld.sock
        name: "{{dbname}}"
        state: present
# Create database user with name 'admin' with all database privileges
    - name: Create database user
      mysql_user:
       login_unix_socket: /var/run/mysqld/mysqld.sock
       name: "{{dbuser}}"
       password: "{{dbpass}}"
       priv: '*.*:ALL'
       state: present
